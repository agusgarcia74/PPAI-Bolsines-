spring.application.name=bolsines

# Base H2 en archivo: los datos sobreviven al reinicio. Para volver a cero, borrar la carpeta data/.
spring.datasource.url=jdbc:h2:file:./data/bolsines
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Consola para mirar las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.servlet.session.tracking-modes=cookie
